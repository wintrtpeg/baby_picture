    </div>
    <div style="flex-grow: 1;">
      <div style="font-size: 13px; font-weight: 500; letter-spacing: -0.1px;">문구를 기다리는 사진 12장</div>

        </div>
      </div>
      <div style="padding: 14px 15px 16px;">
        <div style="font-family: 'Gowun Batang', serif; font-size: 17.5px; letter-spacing: -0.2px;">첫 신발 신은 날</div>
        <div style="margin-top: 8px; font-family: 'Gowun Batang', serif; font-size: 13.5px; color: #6F6659; line-height: 1.6; text-wrap: pretty;">한 발 떼고 멈추고, 또 한 발. 신발이 무거운지 자꾸 제 발끝만 본다.</div>
        <div style="margin-top: 12px; display: flex; align-items: center; gap: 8px;">

            <span style="width: 5px; height: 5px; border-radius: 50%; background: #E0D5C4;"></span>
            <span style="width: 5px; height: 5px; border-radius: 50%; background: #E0D5C4;"></span>
            <span style="width: 5px; height: 5px; border-radius: 50%; background: #E0D5C4;"></span>
          </div>
          <span style="font-size: 11.5px; color: #A9613F; font-weight: 500;">문구 2 / 6</span>
        </div>
      </div>
    </div>

    <div style="margin-top: 22px; display: flex; align-items: center; gap: 9px;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.3px;">9월 8일</span>
      <span style="font-size: 11.5px; color: #A59B8F;">D+556</span>

    </div>

    <div style="margin-top: 13px; background: #FFFFFF; border: 1px solid #EDE5D9; border-radius: 6px; overflow: hidden;">
      <div style="display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: repeat(2, 1fr); gap: 3px; height: 184px;">
        <div style="grid-row: span 2; background: radial-gradient(110% 110% at 75% 20%, #EAF0E5 0%, #C8D8C3 50%, #9DB79A 100%);"></div>
        <div style="background: radial-gradient(115% 95% at 30% 80%, #FDEEE6 0%, #F2D3C6 52%, #D6A99B 100%);"></div>
        <div style="background: radial-gradient(120% 100% at 65% 25%, #E8EDF4 0%, #C7D2E0 55%, #9FAEC4 100%);"></div>
      </div>
    </div>

  <div style="position: absolute; right: 20px; bottom: 96px; width: 56px; height: 56px; border-radius: 50%; background: #A9613F; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(120,70,45,0.28);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>

  <div style="display: flex; border-top: 1px solid #E9E1D5; background: #FBF7F0; padding: 9px 0 24px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 15.5l4.5-4 3.5 3 4-5 5 6"/><circle cx="9" cy="9.5" r="1.4"/></svg>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
