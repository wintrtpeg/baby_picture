<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Instrument+Serif&display=swap">
  <style>
    body { margin: 0; }
    *, *::before, *::after { box-sizing: border-box; }
    a { color: #2E6B58; } a:hover { color: #235244; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F6F4; color: #1A1A18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 52px 12px 0 12px;">
    <div style="min-width: 60px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 14px; color: #55534E; letter-spacing: -0.3px;">취소</span>
    </div>
    <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.4px;">새 모먼트</span>
    <div style="min-width: 60px; height: 44px;"></div>
  </div>

  <div style="padding: 16px 20px 0;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
      <div style="position: relative; aspect-ratio: 1; border-radius: 12px; background: radial-gradient(120% 100% at 25% 15%, #FBE8D6 0%, #EDC9AC 48%, #CFA07C 100%);">
        <span style="position: absolute; left: 7px; top: 7px; font-size: 11px; font-weight: 500; color: #FFFFFF; background: rgba(26,26,24,0.55); border-radius: 6px; padding: 3px 7px; letter-spacing: -0.1px;">대표</span>
      </div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: radial-gradient(100% 110% at 20% 55%, #FCF3DC 0%, #EDDCAE 50%, #CDBA88 100%);"></div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: radial-gradient(110% 100% at 50% 30%, #F0EEEA 0%, #D6D2CB 55%, #ADA79E 100%);"></div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: radial-gradient(115% 95% at 30% 80%, #FDEEE6 0%, #F2D3C6 52%, #D6A99B 100%);"></div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: radial-gradient(120% 100% at 65% 25%, #E8EDF4 0%, #C7D2E0 55%, #9FAEC4 100%);"></div>
      <div style="position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: radial-gradient(110% 110% at 75% 20%, #EAF0E5 0%, #C8D8C3 50%, #9DB79A 100%);">
        <div style="position: absolute; inset: 0; background: rgba(26,26,24,0.42); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: 'Instrument Serif', Georgia, serif; font-size: 20px;">+6</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 22px 20px 0;">

    <div style="background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 14px; padding: 12px 16px 13px;">
      <div style="font-size: 11.5px; color: #6B6963; letter-spacing: -0.1px;">모먼트 제목</div>
      <div style="margin-top: 4px; display: flex; align-items: center;">
        <span style="font-size: 16px; font-weight: 500; letter-spacing: -0.3px;">첫 신발 신은 날</span>
        <span style="display: inline-block; width: 1.5px; height: 18px; background: #1A1A18; margin-left: 2px;"></span>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 14px; padding: 12px 16px 13px; display: flex; align-items: flex-end;">
      <div style="flex-grow: 1;">
        <div style="display: flex; align-items: center; gap: 7px;">
          <span style="font-size: 11.5px; color: #6B6963; letter-spacing: -0.1px;">촬영일</span>
          <span style="font-size: 10px; font-weight: 500; color: #2E6B58; background: #E7EFEB; border-radius: 5px; padding: 2px 6px; letter-spacing: -0.1px;">사진에서 자동</span>
        </div>
        <div style="margin-top: 5px; font-size: 16px; font-weight: 500; letter-spacing: -0.3px;">2026년 9월 13일</div>
      </div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B8B6B0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 13px;">
      <div style="flex-grow: 1;">
        <div style="font-size: 14px; font-weight: 500; letter-spacing: -0.3px;">문구는 나중에 쓰기</div>
        <div style="margin-top: 4px; font-size: 11.5px; font-weight: 300; color: #6B6963; line-height: 1.5;">12장이 문구 대기 목록에 쌓여요</div>
      </div>
      <div style="width: 50px; height: 30px; border-radius: 999px; background: #1A1A18; display: flex; align-items: center; justify-content: flex-end; padding: 0 3px;">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF;"></span>
      </div>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 34px;">
    <div style="display: flex; align-items: center; gap: 7px; padding: 0 2px 12px;">
      <svg width="14" height="14" viewBox="0 0 22 22" fill="none" stroke="#B8B6B0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="16" height="16" rx="5"/><path d="M11 10v5"/><path d="M11 7.2v.1"/></svg>
      <span style="font-size: 11.5px; font-weight: 300; color: #6B6963;">인쇄 화질(긴 변 3200px)로 저장됩니다</span>
    </div>
    <div style="height: 54px; background: #1A1A18; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 7px;">
      <span style="font-size: 15px; font-weight: 500; color: #FFFFFF; letter-spacing: -0.3px;">12장 올리기</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
