<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #D99A5B; } a:hover { color: #C4864A; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0C0C0D; color: #F0EFEC; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 52px 16px 0 18px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.6px;">서아</span>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#6E6D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l4 4 4-4"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 2px;">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 22 22" fill="none" stroke="#A8A6A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="7.5" r="3.2"/><path d="M2.8 18c0-3 2.6-5.2 5.7-5.2S14.2 15 14.2 18"/><path d="M14.6 5.2a3 3 0 0 1 0 5.4"/><path d="M16.4 18c0-2-.7-3.6-1.8-4.7"/></svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 22 22" fill="none" stroke="#A8A6A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h9"/><path d="M17 7h2"/><circle cx="14.5" cy="7" r="2.2"/><path d="M3 15h4"/><path d="M11.5 15h7.5"/><circle cx="9.2" cy="15" r="2.2"/></svg>
      </div>
    </div>
  </div>

  <div style="padding: 6px 18px 0; display: flex; align-items: baseline; gap: 10px;">
    <span style="font-size: 13px; font-weight: 500; color: #D99A5B; letter-spacing: 0.2px;">D+561</span>
    <span style="font-size: 12px; color: #6E6D68;">1년 6개월 11일</span>
  </div>

  <div style="margin: 16px 18px 0; height: 1px; background: #1E1E21;"></div>

  <div style="flex-grow: 1; overflow: hidden;">

    <div style="padding: 16px 18px 9px; display: flex; align-items: center; gap: 9px;">
      <span style="font-size: 13.5px; font-weight: 500; letter-spacing: -0.3px;">첫 신발 신은 날</span>
      <span style="font-size: 11px; color: #6E6D68;">9월 13일</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-size: 10.5px; font-weight: 500; color: #D99A5B; border: 1px solid #3A2E1E; background: #1A150E; border-radius: 3px; padding: 3px 7px;">문구 2 / 6</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px;">
      <div style="aspect-ratio: 1; background: radial-gradient(120% 100% at 25% 15%, #FBE8D6 0%, #EDC9AC 48%, #CFA07C 100%);"></div>
      <div style="aspect-ratio: 1; background: radial-gradient(100% 110% at 20% 55%, #FCF3DC 0%, #EDDCAE 50%, #CDBA88 100%);"></div>
      <div style="position: relative; aspect-ratio: 1; background: radial-gradient(110% 100% at 50% 30%, #F0EEEA 0%, #D6D2CB 55%, #ADA79E 100%);">
        <span style="position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: #D99A5B; box-shadow: 0 0 0 2px rgba(12,12,13,0.5);"></span>
      </div>
      <div style="position: relative; aspect-ratio: 1; background: radial-gradient(115% 95% at 30% 80%, #FDEEE6 0%, #F2D3C6 52%, #D6A99B 100%);">
        <span style="position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: #D99A5B; box-shadow: 0 0 0 2px rgba(12,12,13,0.5);"></span>
      </div>
      <div style="position: relative; aspect-ratio: 1; background: radial-gradient(120% 100% at 65% 25%, #E8EDF4 0%, #C7D2E0 55%, #9FAEC4 100%);">
        <span style="position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: #D99A5B; box-shadow: 0 0 0 2px rgba(12,12,13,0.5);"></span>
      </div>
      <div style="position: relative; aspect-ratio: 1; background: radial-gradient(110% 110% at 75% 20%, #EAF0E5 0%, #C8D8C3 50%, #9DB79A 100%);">
        <span style="position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: #D99A5B; box-shadow: 0 0 0 2px rgba(12,12,13,0.5);"></span>
      </div>
    </div>

    <div style="padding: 11px 18px 0; font-size: 12.5px; font-weight: 300; color: #A8A6A0; line-height: 1.6; text-wrap: pretty;">한 발 떼고 멈추고, 또 한 발. 신발이 무거운지 자꾸 제 발끝만 본다.</div>

    <div style="padding: 24px 18px 9px; display: flex; align-items: center; gap: 9px;">
      <span style="font-size: 13.5px; font-weight: 500; letter-spacing: -0.3px;">할머니 댁에서</span>
      <span style="font-size: 11px; color: #6E6D68;">9월 8일</span>
      <span style="flex-grow: 1;"></span>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 10.5px; color: #6E6D68;">
        <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="#6E6D68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-8"/></svg>
        문구 9 / 9
      </span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px;">
      <div style="aspect-ratio: 1; background: radial-gradient(110% 110% at 75% 20%, #EAF0E5 0%, #C8D8C3 50%, #9DB79A 100%);"></div>
      <div style="aspect-ratio: 1; background: radial-gradient(120% 100% at 65% 25%, #E8EDF4 0%, #C7D2E0 55%, #9FAEC4 100%);"></div>
      <div style="aspect-ratio: 1; background: radial-gradient(115% 95% at 30% 80%, #FDEEE6 0%, #F2D3C6 52%, #D6A99B 100%);"></div>
    </div>

  </div>

  <div style="position: absolute; right: 18px; bottom: 98px; width: 54px; height: 54px; border-radius: 50%; background: #F0EFEC; display: flex; align-items: center; justify-content: center;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0C0C0D" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>

  <div style="display: flex; border-top: 1px solid #1E1E21; background: #0C0C0D; padding: 10px 0 26px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F0EFEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 15.5l4.5-4 3.5 3 4-5 5 6"/><circle cx="9" cy="9.5" r="1.4"/></svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #F0EFEC;">타임라인</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5E5D59" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 5a1.5 1.5 0 0 1 1.5-1.5h11V20H7a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M5.5 17.5H18"/></svg>
      <span style="font-size: 10.5px; color: #5E5D59;">앨범</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5E5D59" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.5" r="3.4"/><path d="M3.5 19.5c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5"/><path d="M16 6a3.2 3.2 0 0 1 0 5.8"/><path d="M17.8 19.5c0-2.2-.8-3.9-2-5"/></svg>
      <span style="font-size: 10.5px; color: #5E5D59;">가족</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
