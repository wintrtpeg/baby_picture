<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Instrument+Serif&display=swap">
  <style>
    body { margin: 0; }
    *, *::before, *::after { box-sizing: border-box; }
    a { color: #2E6B58; } a:hover { color: #235244; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F6F4; color: #1A1A18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 52px 12px 0 12px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="#1A1A18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4L6 11l7 7"/></svg>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="#1A1A18" stroke-width="1.8" stroke-linecap="round"><path d="M5 11h.01M11 11h.01M17 11h.01"/></svg>
    </div>
  </div>

  <div style="padding: 10px 20px 0;">
    <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.7px;">첫 신발 신은 날</div>
    <div style="margin-top: 7px; display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 12px; color: #6B6963;">2026년 9월 13일</span>
      <span style="width: 2px; height: 2px; border-radius: 50%; background: #C8C6C0;"></span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 13.5px; color: #6B6963;">D+561</span>
      <span style="width: 2px; height: 2px; border-radius: 50%; background: #C8C6C0;"></span>
      <span style="font-size: 12px; color: #6B6963;">사진 6장</span>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 18px 20px 0;">

    <div style="height: 212px; border-radius: 16px; background: radial-gradient(120% 100% at 25% 15%, #FBE8D6 0%, #EDC9AC 48%, #CFA07C 100%);"></div>
    <div style="padding: 12px 2px 0;">
      <div style="font-size: 14px; font-weight: 300; line-height: 1.7; color: #1A1A18; text-wrap: pretty;">한 발 떼고 멈추고, 또 한 발. 신발이 무거운지 자꾸 제 발끝만 본다.</div>
      <div style="margin-top: 8px; display: flex; align-items: center; gap: 7px;">
        <span style="width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(115% 95% at 30% 80%, #FDEEE6 0%, #F2D3C6 52%, #D6A99B 100%);"></span>
        <span style="font-size: 11px; color: #6B6963;">엄마가 씀</span>
      </div>
    </div>

    <div style="margin-top: 22px; height: 212px; border-radius: 16px; background: radial-gradient(100% 110% at 20% 55%, #FCF3DC 0%, #EDDCAE 50%, #CDBA88 100%);"></div>
    <div style="margin-top: 12px; border: 1px dashed #D5D3CD; border-radius: 12px; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 7px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8C8A84" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span style="font-size: 13px; color: #6B6963; letter-spacing: -0.2px;">문구 추가</span>
    </div>

    <div style="margin-top: 22px; height: 212px; border-radius: 16px; background: radial-gradient(110% 100% at 50% 30%, #F0EEEA 0%, #D6D2CB 55%, #ADA79E 100%);"></div>

  </div>

  <div style="border-top: 1px solid #E8E6E1; background: rgba(247,246,244,0.96); padding: 12px 20px 34px; display: flex; align-items: center; gap: 12px;">
    <div style="flex-grow: 1;">
      <div style="font-size: 13px; font-weight: 500; letter-spacing: -0.3px;">문구 2 / 6</div>
      <div style="margin-top: 3px; font-size: 11px; color: #6B6963;">4장이 아직 비어 있어요</div>
    </div>
    <div style="height: 46px; padding: 0 20px; background: #1A1A18; border-radius: 13px; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 13.5px; font-weight: 500; color: #FFFFFF; letter-spacing: -0.3px;">이어서 쓰기</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
