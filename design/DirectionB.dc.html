<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #5F8A7D; } a:hover { color: #4A6E63; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F4F2; color: #1B1C1A; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 52px 18px 0 18px;">
    <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 999px; padding: 5px 14px 5px 5px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">

      <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.3px;">서아</span>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#9A9A94" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l4 4 4-4"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 2px;">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 22 22" fill="none" stroke="#55574F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="7.5" r="3.2"/><path d="M2.8 18c0-3 2.6-5.2 5.7-5.2S14.2 15 14.2 18"/><path d="M14.6 5.2a3 3 0 0 1 0 5.4"/><path d="M16.4 18c0-2-.7-3.6-1.8-4.7"/></svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 22 22" fill="none" stroke="#55574F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h9"/><path d="M17 7h2"/><circle cx="14.5" cy="7" r="2.2"/><path d="M3 15h4"/><path d="M11.5 15h7.5"/><circle cx="9.2" cy="15" r="2.2"/></svg>
      </div>
    </div>
  </div>

  <div style="padding: 22px 20px 0;">
    <div style="display: flex; align-items: flex-end; gap: 9px;">
      <span style="font-size: 40px; font-weight: 300; line-height: 1; letter-spacing: -1.6px;">561</span>
      <span style="font-size: 15px; font-weight: 500; color: #55574F; padding-bottom: 4px;">일째</span>
    </div>
    <div style="margin-top: 9px; display: flex; gap: 6px;">
      <span style="font-size: 11.5px; font-weight: 500; color: #4A6E63; background: #E4EDE9; border-radius: 999px; padding: 5px 10px;">1년 6개월 11일</span>
      <span style="font-size: 11.5px; color: #7C7E76; background: #EAEAE7; border-radius: 999px; padding: 5px 10px;">2025.03.02 출생</span>
    </div>
  </div>

  <div style="margin: 20px 18px 0; background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 13px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 10px 24px rgba(0,0,0,0.035);">
    <div style="width: 42px; height: 42px; border-radius: 14px; background: #E4EDE9; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A6E63" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5h14"/><path d="M5 11.5h14"/><path d="M5 16.5h8"/></svg>
    </div>
    <div style="flex-grow: 1;">
      <div style="font-size: 13.5px; font-weight: 600; letter-spacing: -0.2px;">문구를 기다리는 사진 12장</div>
      <div style="font-size: 11.5px; color: #85877F; margin-top: 3px;">앨범에 인쇄될 글을 채워 주세요</div>
    </div>
    <svg width="17" height="17" viewBox="0 0 22 22" fill="none" stroke="#B4B6AE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l7 7-7 7"/></svg>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 24px 18px 0;">

    <div style="display: flex; align-items: center; gap: 8px; padding-left: 2px;">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: -0.2px;">오늘</span>
      <span style="font-size: 11.5px; color: #9A9C94;">9월 13일</span>
    </div>

    <div style="margin-top: 12px; background: #FFFFFF; border-radius: 22px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 10px 26px rgba(0,0,0,0.04);">
      <div style="padding: 6px; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: repeat(2, 1fr); gap: 5px; height: 190px;">
        <div style="grid-row: span 2; border-radius: 17px; background: radial-gradient(120% 100% at 25% 15%, #FBE8D6 0%, #EDC9AC 48%, #CFA07C 100%);"></div>
        <div style="border-radius: 13px; background: radial-gradient(100% 110% at 20% 55%, #FCF3DC 0%, #EDDCAE 50%, #CDBA88 100%);"></div>
        <div style="position: relative; border-radius: 13px; overflow: hidden; background: radial-gradient(110% 100% at 50% 30%, #F0EEEA 0%, #D6D2CB 55%, #ADA79E 100%);">
          <div style="position: absolute; inset: 0; background: rgba(27,28,26,0.4); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 14px; font-weight: 500;">+3</div>
        </div>
      </div>
      <div style="padding: 6px 18px 18px;">
        <div style="font-size: 16px; font-weight: 600; letter-spacing: -0.3px;">첫 신발 신은 날</div>
        <div style="margin-top: 7px; font-size: 13px; font-weight: 300; color: #5C5E56; line-height: 1.62; text-wrap: pretty;">한 발 떼고 멈추고, 또 한 발. 신발이 무거운지 자꾸 제 발끝만 본다.</div>
        <div style="margin-top: 13px; display: flex; align-items: center; gap: 9px;">
          <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #EAEAE7; overflow: hidden;">
            <div style="width: 33%; height: 4px; border-radius: 999px; background: #5F8A7D;"></div>
          </div>
          <span style="font-size: 11.5px; color: #4A6E63; font-weight: 600;">문구 2 / 6</span>
        </div>
      </div>
    </div>

    <div style="margin-top: 22px; display: flex; align-items: center; gap: 8px; padding-left: 2px;">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: -0.2px;">9월 8일</span>
      <span style="font-size: 11.5px; color: #9A9C94;">D+556</span>
    </div>

    <div style="margin-top: 12px; background: #FFFFFF; border-radius: 22px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 10px 26px rgba(0,0,0,0.04);">
      <div style="padding: 6px; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: repeat(2, 1fr); gap: 5px; height: 190px;">
        <div style="grid-row: span 2; border-radius: 17px; background: radial-gradient(110% 110% at 75% 20%, #EAF0E5 0%, #C8D8C3 50%, #9DB79A 100%);"></div>
        <div style="border-radius: 13px; background: radial-gradient(115% 95% at 30% 80%, #FDEEE6 0%, #F2D3C6 52%, #D6A99B 100%);"></div>
        <div style="border-radius: 13px; background: radial-gradient(120% 100% at 65% 25%, #E8EDF4 0%, #C7D2E0 55%, #9FAEC4 100%);"></div>
      </div>
    </div>

  </div>

  <div style="position: absolute; right: 20px; bottom: 100px; width: 56px; height: 56px; border-radius: 20px; background: #5F8A7D; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(95,138,125,0.4);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>

  <div style="display: flex; background: rgba(244,244,242,0.94); padding: 10px 14px 26px; gap: 6px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center; background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1B1C1A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><path d="M3.5 15.5l4.5-4 3.5 3 4-5 5 6"/><circle cx="9" cy="9.5" r="1.4"/></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #1B1C1A;">타임라인</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9A9C94" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 5a1.5 1.5 0 0 1 1.5-1.5h11V20H7a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M5.5 17.5H18"/></svg>
      <span style="font-size: 10.5px; color: #9A9C94;">앨범</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9A9C94" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.5" r="3.4"/><path d="M3.5 19.5c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5"/><path d="M16 6a3.2 3.2 0 0 1 0 5.8"/><path d="M17.8 19.5c0-2.2-.8-3.9-2-5"/></svg>
      <span style="font-size: 10.5px; color: #9A9C94;">가족</span>
    </div>
  </div>

</div>

</html>
