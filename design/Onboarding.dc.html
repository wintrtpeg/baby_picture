<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Instrument+Serif&display=swap">
  <style>
    body { margin: 0; }
    *, *::before, *::after { box-sizing: border-box; }
    a { color: #2E6B58; } a:hover { color: #235244; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F6F4; color: #1A1A18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; padding: 52px 12px 0 12px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="#1A1A18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4L6 11l7 7"/></svg>
    </div>
    <span style="flex-grow: 1;"></span>
    <div style="display: flex; gap: 5px; padding-right: 18px;">
      <span style="width: 20px; height: 3px; border-radius: 999px; background: #1A1A18;"></span>
      <span style="width: 20px; height: 3px; border-radius: 999px; background: #DFDDD8;"></span>
    </div>
  </div>

  <div style="padding: 26px 20px 0;">
    <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.8px; line-height: 1.35;">아기를 등록해 주세요</div>
    <div style="margin-top: 9px; font-size: 13.5px; font-weight: 300; color: #55534E; line-height: 1.6;">생일을 기준으로 사진마다 날짜가 자동으로 붙어요.</div>
  </div>

  <div style="display: flex; justify-content: center; padding: 30px 0 0;">
    <div style="position: relative; width: 96px; height: 96px;">
      <div style="width: 96px; height: 96px; border-radius: 50%; background: #F1F0ED; border: 1px dashed #CFCDC7; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A8A6A0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h3l1.5-2.2h7L17 8.5h3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>
      </div>
      <div style="position: absolute; right: -2px; bottom: -2px; width: 30px; height: 30px; border-radius: 50%; background: #1A1A18; border: 3px solid #F7F6F4; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 30px 20px 0;">

    <div style="background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 14px; padding: 12px 16px 13px;">
      <div style="font-size: 11.5px; color: #6B6963; letter-spacing: -0.1px;">이름</div>
      <div style="margin-top: 4px; display: flex; align-items: center;">
        <span style="font-size: 16px; font-weight: 500; letter-spacing: -0.3px;">서아</span>
        <span style="display: inline-block; width: 1.5px; height: 18px; background: #1A1A18; margin-left: 2px;"></span>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 14px; padding: 12px 16px 13px; display: flex; align-items: flex-end;">
      <div style="flex-grow: 1;">
        <div style="font-size: 11.5px; color: #6B6963; letter-spacing: -0.1px;">생일</div>
        <div style="margin-top: 4px; font-size: 16px; font-weight: 500; letter-spacing: -0.3px;">2025년 3월 2일</div>
      </div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B8B6B0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
    </div>

    <div>
      <div style="font-size: 11.5px; color: #6B6963; letter-spacing: -0.1px; padding: 0 2px 7px;">성별</div>
      <div style="display: flex; gap: 4px; background: #EFEEEB; border-radius: 14px; padding: 4px;">
        <div style="flex-grow: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border-radius: 11px; box-shadow: 0 1px 2px rgba(26,26,24,0.06); font-size: 14px; font-weight: 600; letter-spacing: -0.3px;">여아</div>
        <div style="flex-grow: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #6B6963; letter-spacing: -0.3px;">남아</div>
        <div style="flex-grow: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #6B6963; letter-spacing: -0.3px;">밝히지 않음</div>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: flex-start; gap: 8px; padding: 20px 22px 0;">
    <svg width="15" height="15" viewBox="0 0 22 22" fill="none" stroke="#B8B6B0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><rect x="3" y="3" width="16" height="16" rx="5"/><path d="M11 10v5"/><path d="M11 7.2v.1"/></svg>
    <span style="font-size: 11.5px; font-weight: 300; color: #6B6963; line-height: 1.55;">등록한 사진은 초대한 가족만 볼 수 있어요. 공개되는 곳은 어디에도 없습니다.</span>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 34px;">
    <div style="height: 54px; background: #1A1A18; border-radius: 15px; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 15px; font-weight: 500; color: #FFFFFF; letter-spacing: -0.3px;">다음</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
