<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Instrument+Serif&display=swap">
  <style>
    body { margin: 0; }
    *, *::before, *::after { box-sizing: border-box; }
    a { color: #2E6B58; } a:hover { color: #235244; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F6F4; color: #1A1A18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 52px 12px 0 12px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="#1A1A18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4L6 11l7 7"/></svg>
    </div>
    <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.4px;">앨범 내보내기</span>
    <div style="width: 44px; height: 44px;"></div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 14px 20px 0;">

    <div style="background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 16px; padding: 13px 16px 14px; display: flex; align-items: flex-end;">
      <div style="flex-grow: 1;">
        <div style="font-size: 11.5px; color: #6B6963; letter-spacing: -0.1px;">기간</div>
        <div style="margin-top: 5px; font-size: 16px; font-weight: 500; letter-spacing: -0.3px;">2026.03.01 &ndash; 09.13</div>
      </div>
      <span style="font-size: 12px; color: #6B6963;">6개월</span>
    </div>

    <div style="margin-top: 10px; background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 16px; padding: 16px; display: flex;">
      <div style="flex-grow: 1;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; line-height: 1;">218</div>
        <div style="margin-top: 5px; font-size: 11.5px; color: #6B6963;">사진</div>
      </div>
      <div style="width: 1px; background: #EDECE8; margin: 0 4px;"></div>
      <div style="flex-grow: 1; padding-left: 18px;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; line-height: 1;">194</div>
        <div style="margin-top: 5px; font-size: 11.5px; color: #6B6963;">문구</div>
      </div>
    </div>

    <div style="margin-top: 10px; background: #FBF4EC; border: 1px solid #F0E3D2; border-radius: 16px; padding: 13px 15px; display: flex; align-items: center; gap: 12px;">
      <svg width="19" height="19" viewBox="0 0 22 22" fill="none" stroke="#B07A4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M11 3.5l8 14.5H3z"/><path d="M11 9v3.5"/><path d="M11 15.2v.1"/></svg>
      <div style="flex-grow: 1;">
        <div style="font-size: 13px; font-weight: 500; letter-spacing: -0.3px;">문구 없는 사진 24장</div>
        <div style="margin-top: 3px; font-size: 11.5px; font-weight: 300; color: #7A6140;">글 없이 사진만 들어갑니다</div>
      </div>
      <span style="font-size: 12px; font-weight: 500; color: #1A1A18; border-bottom: 1px solid #C9BCA9; padding-bottom: 1px;">채우기</span>
    </div>

    <div style="padding: 22px 2px 10px; font-size: 11.5px; font-weight: 500; color: #6B6963; letter-spacing: -0.1px;">내보내는 형식</div>

    <div style="background: #FFFFFF; border: 1.5px solid #1A1A18; border-radius: 16px; padding: 14px 16px 15px; display: flex; gap: 12px;">
      <span style="width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid #1A1A18; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: #1A1A18;"></span>
      </span>
      <div style="flex-grow: 1;">
        <div style="font-size: 14.5px; font-weight: 600; letter-spacing: -0.3px;">사진 + 문구 (ZIP)</div>
        <div style="margin-top: 5px; font-size: 12px; font-weight: 300; color: #55534E; line-height: 1.6; text-wrap: pretty;">포토북 업체 편집기에 그대로 올릴 수 있어요. 사진 파일과 문구 목록이 짝지어 들어갑니다.</div>
      </div>
    </div>

    <div style="margin-top: 8px; background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 16px; padding: 14px 16px 15px; display: flex; gap: 12px;">
      <span style="width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid #D5D3CD; flex-shrink: 0; margin-top: 1px;"></span>
      <div style="flex-grow: 1;">
        <div style="font-size: 14.5px; font-weight: 500; letter-spacing: -0.3px;">PDF 초안</div>
        <div style="margin-top: 5px; font-size: 12px; font-weight: 300; color: #6B6963; line-height: 1.6;">배치까지 된 미리보기. 확인용으로 좋아요.</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 7px; padding: 15px 2px 0;">
      <svg width="14" height="14" viewBox="0 0 22 22" fill="none" stroke="#B8B6B0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="16" height="16" rx="5"/><path d="M11 10v5"/><path d="M11 7.2v.1"/></svg>
      <span style="font-size: 11.5px; font-weight: 300; color: #6B6963;">긴 변 3200px &middot; 8&times;10인치까지 300dpi로 인쇄 가능</span>
    </div>

    <div style="margin-top: 16px; height: 54px; background: #1A1A18; border-radius: 15px; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 15px; font-weight: 500; color: #FFFFFF; letter-spacing: -0.3px;">내보내기 준비하기</span>
    </div>

  </div>

  <div style="display: flex; border-top: 1px solid #E8E6E1; background: rgba(247,246,244,0.96); padding: 9px 0 34px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#B8B6B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><path d="M3.5 15.5l4.5-4 3.5 3 4-5 5 6"/><circle cx="9" cy="9.5" r="1.4"/></svg>
      <span style="font-size: 11px; color: #6B6963; letter-spacing: -0.1px;">타임라인</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1A1A18" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 5a1.5 1.5 0 0 1 1.5-1.5h11V20H7a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M5.5 17.5H18"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #1A1A18; letter-spacing: -0.1px;">앨범</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#B8B6B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.5" r="3.4"/><path d="M3.5 19.5c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5"/><path d="M16 6a3.2 3.2 0 0 1 0 5.8"/><path d="M17.8 19.5c0-2.2-.8-3.9-2-5"/></svg>
      <span style="font-size: 11px; color: #6B6963; letter-spacing: -0.1px;">가족</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
