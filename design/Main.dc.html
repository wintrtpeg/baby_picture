<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Instrument+Serif&display=swap">
  <style>
    body { margin: 0; }
    *, *::before, *::after { box-sizing: border-box; }
    a { color: #2E6B58; } a:hover { color: #235244; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F6F4; color: #1A1A18; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 52px 12px 0 18px;">
    <div style="display: flex; align-items: center; gap: 9px; min-height: 44px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(120% 100% at 25% 15%, #FBE8D6 0%, #EDC9AC 48%, #CFA07C 100%);"></div>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.4px;">서아</span>
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#B8B6B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l4 4 4-4"/></svg>
    </div>
    <div style="display: flex; align-items: center;">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 22 22" fill="none" stroke="#55534E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="7.5" r="3.2"/><path d="M2.8 18c0-3 2.6-5.2 5.7-5.2S14.2 15 14.2 18"/><path d="M14.6 5.2a3 3 0 0 1 0 5.4"/><path d="M16.4 18c0-2-.7-3.6-1.8-4.7"/></svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 22 22" fill="none" stroke="#55534E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h9"/><path d="M17 7h2"/><circle cx="14.5" cy="7" r="2.2"/><path d="M3 15h4"/><path d="M11.5 15h7.5"/><circle cx="9.2" cy="15" r="2.2"/></svg>
      </div>
    </div>
  </div>

  <div style="padding: 18px 20px 0;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 54px; line-height: 0.92; letter-spacing: -1px;">561</span>
      <span style="font-size: 15px; font-weight: 500; color: #55534E; letter-spacing: -0.3px;">일째</span>
    </div>
    <div style="margin-top: 11px; display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 12.5px; color: #55534E; letter-spacing: -0.1px;">1년 6개월 11일</span>
      <span style="width: 2px; height: 2px; border-radius: 50%; background: #C8C6C0;"></span>
      <span style="font-size: 12.5px; color: #6B6963;">2025.03.02 출생</span>
    </div>
  </div>

  <div style="margin: 20px 20px 0; background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 18px; padding: 13px 15px; display: flex; align-items: center; gap: 13px;">
    <div style="display: flex;">
      <div style="width: 32px; height: 32px; border-radius: 9px; background: radial-gradient(110% 110% at 75% 20%, #EAF0E5 0%, #C8D8C3 50%, #9DB79A 100%); box-shadow: 0 0 0 2px #FFFFFF;"></div>
      <div style="width: 32px; height: 32px; border-radius: 9px; margin-left: -12px; background: radial-gradient(115% 95% at 30% 80%, #FDEEE6 0%, #F2D3C6 52%, #D6A99B 100%); box-shadow: 0 0 0 2px #FFFFFF;"></div>
      <div style="width: 32px; height: 32px; border-radius: 9px; margin-left: -12px; background: radial-gradient(120% 100% at 65% 25%, #E8EDF4 0%, #C7D2E0 55%, #9FAEC4 100%); box-shadow: 0 0 0 2px #FFFFFF;"></div>
    </div>
    <div style="flex-grow: 1;">
      <div style="font-size: 13.5px; font-weight: 600; letter-spacing: -0.3px;">문구를 기다리는 사진 12장</div>
      <div style="font-size: 11.5px; color: #6B6963; margin-top: 3px;">앨범에 인쇄될 글을 채워 주세요</div>
    </div>
    <svg width="16" height="16" viewBox="0 0 22 22" fill="none" stroke="#B8B6B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l7 7-7 7"/></svg>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 24px 20px 0;">

    <div style="display: flex; align-items: baseline; gap: 8px; padding-bottom: 11px;">
      <span style="font-size: 13.5px; font-weight: 600; letter-spacing: -0.3px;">오늘</span>
      <span style="font-size: 11.5px; color: #6B6963;">9월 13일</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 14px; color: #6B6963;">D+561</span>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 18px; overflow: hidden;">
      <div style="padding: 5px; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 4px; height: 188px;">
        <div style="grid-row: span 2; border-radius: 14px; background: radial-gradient(120% 100% at 25% 15%, #FBE8D6 0%, #EDC9AC 48%, #CFA07C 100%);"></div>
        <div style="border-radius: 11px; background: radial-gradient(100% 110% at 20% 55%, #FCF3DC 0%, #EDDCAE 50%, #CDBA88 100%);"></div>
        <div style="position: relative; border-radius: 11px; overflow: hidden; background: radial-gradient(110% 100% at 50% 30%, #F0EEEA 0%, #D6D2CB 55%, #ADA79E 100%);">
          <div style="position: absolute; inset: 0; background: rgba(26,26,24,0.38); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: 'Instrument Serif', Georgia, serif; font-size: 18px;">+3</div>
        </div>
      </div>
      <div style="padding: 11px 16px 16px;">
        <div style="font-size: 16.5px; font-weight: 600; letter-spacing: -0.4px;">첫 신발 신은 날</div>
        <div style="margin-top: 7px; font-size: 13px; font-weight: 300; color: #55534E; line-height: 1.6; text-wrap: pretty;">한 발 떼고 멈추고, 또 한 발. 신발이 무거운지 자꾸 제 발끝만 본다.</div>
        <div style="margin-top: 13px; display: flex; align-items: center; gap: 10px;">
          <div style="flex-grow: 1; height: 3px; border-radius: 999px; background: #EDECE8; overflow: hidden;">
            <div style="width: 33%; height: 3px; border-radius: 999px; background: #2E6B58;"></div>
          </div>
          <span style="font-size: 11px; color: #2E6B58; font-weight: 500; letter-spacing: -0.1px;">문구 2 / 6</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: baseline; gap: 8px; padding: 24px 0 11px;">
      <span style="font-size: 13.5px; font-weight: 600; letter-spacing: -0.3px;">9월 8일</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 14px; color: #6B6963;">D+556</span>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 18px; overflow: hidden;">
      <div style="padding: 5px; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 4px; height: 188px;">
        <div style="grid-row: span 2; border-radius: 14px; background: radial-gradient(110% 110% at 75% 20%, #EAF0E5 0%, #C8D8C3 50%, #9DB79A 100%);"></div>
        <div style="border-radius: 11px; background: radial-gradient(115% 95% at 30% 80%, #FDEEE6 0%, #F2D3C6 52%, #D6A99B 100%);"></div>
        <div style="border-radius: 11px; background: radial-gradient(120% 100% at 65% 25%, #E8EDF4 0%, #C7D2E0 55%, #9FAEC4 100%);"></div>
      </div>
    </div>

  </div>

  <div style="position: absolute; right: 20px; bottom: 98px; width: 56px; height: 56px; border-radius: 18px; background: #1A1A18; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(26,26,24,0.22);">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>

  <div style="display: flex; border-top: 1px solid #E8E6E1; background: rgba(247,246,244,0.96); padding: 9px 0 34px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1A1A18" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><path d="M3.5 15.5l4.5-4 3.5 3 4-5 5 6"/><circle cx="9" cy="9.5" r="1.4"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #1A1A18; letter-spacing: -0.1px;">타임라인</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#B8B6B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 5a1.5 1.5 0 0 1 1.5-1.5h11V20H7a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M5.5 17.5H18"/></svg>
      <span style="font-size: 11px; color: #6B6963; letter-spacing: -0.1px;">앨범</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#B8B6B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.5" r="3.4"/><path d="M3.5 19.5c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5"/><path d="M16 6a3.2 3.2 0 0 1 0 5.8"/><path d="M17.8 19.5c0-2.2-.8-3.9-2-5"/></svg>
      <span style="font-size: 11px; color: #6B6963; letter-spacing: -0.1px;">가족</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
